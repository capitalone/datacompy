; Runs the existing Spark suite against a Spark Connect session.
;
; pytest-spark turns `spark_connect_url` into `SparkSession.builder.remote(...)`,
; and PySpark 4.x starts a local Connect server from the jar bundled in the
; wheel -- no external server needed.
;
; `spark.master` must NOT be set here: PySpark rejects a session configured with
; both a master and a Connect URL (CANNOT_CONFIGURE_SPARK_CONNECT_MASTER). The
; other classic-only options (executor cores, parallelism, catalog
; implementation) are meaningless server-side under Connect, and
; `spark.sql.execution.arrow.pyspark.enabled` is a no-op because Connect always
; uses Arrow on the wire.
;
; The tests marked `spark_connect` are excluded: they build their own session
; and must run in a separate pytest process.
[pytest]
addopts = -m "not spark_connect"
markers =
  pyspark: needs pyspark installed
  spark_connect: needs a Spark Connect session and its own pytest process, because starting a local Connect server sets SPARK_LOCAL_REMOTE, after which every later SparkSession.builder.getOrCreate() in the process returns the Connect session. Run with: pytest -m spark_connect tests/test_spark_connect.py
spark_connect_url = local[2]
spark_options =
  spark.sql.shuffle.partitions: 4
  spark.sql.adaptive.enabled: false
  spark.sql.ansi.enabled: false
