; Tox configuration for datacompy's local test matrix, using conda-managed
; environments (tox-conda) so Java and PySpark can be pulled from conda-forge
; rather than requiring a preinstalled JDK.
;
; envlist mirrors ``.github/workflows/test-package.yml`` job for job:
;
;   CI job                      tox env
;   --------------------------  --------------------------------------------
;   lint-and-format             lint
;   test-basic-install          py{310,311,312,313}-nospark
;   test-with-spark-3-install   py311-spark35-pandas2
;   test-with-spark-4-install   py310-spark4-pandas2
;                               py312-spark4-pandas3   <- also ANSI + Connect
;
; WHY THE SPARK MATRIX IS SMALL. Spark jobs are the entire cost of a test run
; (~20 min each; the four nospark jobs finish in under a minute). The axes are
; therefore covered independently rather than as a cross product:
;
;   * python 3.10-3.13 breadth comes from the four cheap nospark envs, which
;     exercise all the pandas/polars/base/report/comparator code.
;   * pandas 2 vs 3 is a real API split, so both appear -- pandas2 on the
;     python 3.10 env (CI cannot pair 3.10 with pandas 3), pandas3 on 3.12.
;   * spark 3.5 vs 4 is a real API split, so both appear.
;   * ANSI mode and Spark Connect are spark-side semantics, orthogonal to the
;     python and pandas versions, so they run once on the 3.12 baseline rather
;     than on every spark env.
;
; KNOWN GAP: no spark env runs on python 3.11 or 3.13, so a Spark break
; specific to those runtimes would not be caught here. Widening is one line --
; add e.g. ``py313-spark4-pandas3`` to envlist and to the CI matrix.
;
; ``py311-spark35-connect`` is deliberately NOT in envlist -- see its comment.
;
; Snowflake tests are skipped automatically via
; ``pytest.importorskip("snowflake.snowpark")`` when the snowflake extra is not
; installed, and CI does not install it either -- so this file omits it.
;
; tox-conda 0.10.x only supports tox 3 (``envlist`` not ``env_list``,
; ``usedevelop`` not ``package = editable``).
;
; Local usage:
;   pip install "tox<4" tox-conda
;   tox                            # the whole envlist
;   tox -e lint                    # ruff check + ruff format --check
;   tox -e py312-spark4-pandas3    # the one env that covers ANSI + Connect
;   tox -e typecheck               # mypy (not in envlist; not run by CI)
;   tox -e py312-spark4-pandas3 -- tests/test_pandas.py   # forward to pytest
;
; Envs outside envlist still work: any py{310,311,312,313}-spark4-pandas{2,3}
; or py{310,311}-spark35-pandas{2,3} combination can be run with -e.
;
; NOTE: ``{posargs}`` replaces the default test paths in *every* command of an
; env, including the Spark Connect ones, so passing a path runs that path under
; each pytest config rather than appending a fifth invocation.

[tox]
requires =
    tox<4
    tox-conda
envlist =
    lint
    py{310,311,312,313}-nospark
    py311-spark35-pandas2
    py310-spark4-pandas2
    py312-spark4-pandas3

[testenv]
description = Run the datacompy test suite for {envname}
usedevelop = true
; SPARK_LOCAL_REMOTE is deliberately NOT passed through. If it is set in the
; calling shell -- a stray export, or a leftover from a Connect run in the same
; terminal -- every ``SparkSession.builder.getOrCreate()`` returns a Connect
; session, and the classic-session envs silently stop testing classic sessions.
passenv =
    JAVA_HOME
    HADOOP_HOME
    SPARK_HOME
    SPARK_LOCAL_IP
    http_proxy
    https_proxy
    no_proxy
    HTTP_PROXY
    HTTPS_PROXY
    NO_PROXY
; COVERAGE_FILE: every env runs pytest from {toxinidir}, so without this they
; all write the same ``.coverage`` and each env erases the previous env's data.
; Per-env files can be merged afterwards with ``coverage combine``.
setenv =
    PYTHONDONTWRITEBYTECODE = 1
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
conda_channels =
    conda-forge
; ``--override-channels`` keeps conda off any base channels configured in the
; user's ``.condarc``, so the solve is reproducible across machines.
;
; That alone does NOT keep GraalPy out. conda-forge itself ships GraalVM builds
; of openjdk 17 (``17.0.5.8=0_graalvm223b08`` and ``17.0.7.4=0_graalvm230b10``),
; and picking one drags in ``graalpy-graalvm``, which replaces CPython with
; ``python-3.10.8-*_graalpy``. pip then dies with a Truffle
; ``Unable to load native posix support library`` error. It only bites the
; python 3.10 envs, because GraalPy implements python 3.10 and so is a legal
; solution for ``python=3.10`` but not for 3.11+. Both GraalVM builds are below
; 17.0.8, so the ``openjdk`` floor in each spark env's ``conda_deps`` excludes
; them by construction -- do not relax it back to a bare ``openjdk=17``.
conda_create_args =
    --override-channels
conda_install_args =
    --override-channels

; Mirrors the ``lint-and-format`` CI job, which pins python 3.12.
[testenv:lint]
description = ruff lint + format check
basepython = python3.12
extras =
    qa
commands =
    {envbindir}/python -m ruff check {posargs}
    {envbindir}/python -m ruff format --check {posargs}

; Not part of envlist and not run by CI, but ``mypy --strict`` is a documented
; project convention (see CLAUDE.md), so make it available as one command.
[testenv:typecheck]
description = mypy type check
basepython = python3.12
extras =
    qa
commands =
    {envbindir}/python -m mypy {posargs:.}

; Basic install: no pyspark, no snowflake. pandas/polars/base/report/comparator
; tests run; spark and snowflake tests are skipped via ``importorskip``.
; Mirrors ``test-basic-install``, which likewise pins no pandas version.
[testenv:py{310,311,312,313}-nospark]
extras =
    qa
    tests
commands =
    {envbindir}/python -m pytest --cov=datacompy --cov-report=term-missing {posargs}

; Spark 3.5 track, mirroring ``test-with-spark-3-install``. pyspark is pinned to
; 3.5.8; openjdk 17 comes from conda-forge. Only ``py311-spark35-pandas2`` is in
; envlist -- Spark 3.5 is the legacy path and one job is enough to prove it
; still works; the other combinations remain available via -e.
;
; ANSI mode is not run here: it is a spark-side behaviour and is covered once,
; on py312-spark4-pandas3. Spark Connect is not run here either -- see
; ``py311-spark35-connect`` below.
[testenv:py{310,311}-spark35-pandas{2,3}]
extras =
    qa
    tests
    tests-spark
conda_deps =
    openjdk>=17.0.8,<18
deps =
    pyspark[connect]==3.5.8
    pandas2: pandas==2.3.3
    pandas3: pandas==3.0.3
commands =
    {envbindir}/python -m pytest --cov=datacompy --cov-report=term-missing {posargs}

; Spark 3.5 + Spark Connect. Experimental: Spark 3.5 does not bundle the
; Connect server jar in the pyspark wheel (4.x does), so we ask the JVM to
; resolve it at gateway-launch time via Ivy by setting ``PYSPARK_SUBMIT_ARGS``
; -- PySpark's ``launch_gateway`` uses that env var to build the ``spark-submit``
; command, and ``--packages`` there triggers Ivy resolution before the Connect
; plugin class is loaded. The first run downloads the jar from Maven Central
; and caches it under ``~/.ivy2``; subsequent runs are offline. CI has never
; exercised this combination, so treat failures here as informative rather
; than blocking -- if a red ``tox`` run is a problem, drop this from envlist.
[testenv:py311-spark35-connect]
extras =
    qa
    tests
    tests-spark
conda_deps =
    openjdk>=17.0.8,<18
deps =
    pyspark[connect]==3.5.8
setenv =
    {[testenv]setenv}
    PYSPARK_SUBMIT_ARGS = --packages org.apache.spark:spark-connect_2.12:3.5.8 pyspark-shell
commands =
    {envbindir}/python -m pytest -c pytest-connect.ini {posargs:tests/test_spark.py tests/comparator/}
    {envbindir}/python -m pytest -m spark_connect {posargs:tests/test_spark_connect.py}

; Spark 4 track, mirroring ``test-with-spark-4-install``. A classic session
; only -- ANSI mode and Spark Connect are covered once, by the dedicated
; ``py312-spark4-pandas3`` section below. Any combination here can be run with
; -e; ``py310-spark4-pandas2`` is the one in envlist.
[testenv:py{310,311,312,313}-spark4-pandas{2,3}]
extras =
    qa
    tests
    tests-spark
conda_deps =
    openjdk>=17.0.8,<18
deps =
    pyspark[connect]==4.1.2
    pandas2: pandas==2.3.3
    pandas3: pandas==3.0.3
commands =
    {envbindir}/python -m pytest --cov=datacompy --cov-report=term-missing {posargs}

; The one env that runs everything: classic session, ANSI mode, and both Spark
; Connect suites. An exact section name wins over the generative section above,
; so this replaces -- rather than extends -- that env's commands.
;
; Connect must run in its own pytest process because starting a local Connect
; server sets SPARK_LOCAL_REMOTE, after which every later
; ``SparkSession.builder.getOrCreate()`` returns the Connect session -- so a
; classic and a Connect session cannot coexist in one run.
;
; The Connect commands carry no ``--cov``: they re-run tests already measured by
; the two classic commands, and CI does not measure them either.
[testenv:py312-spark4-pandas3]
extras =
    qa
    tests
    tests-spark
conda_deps =
    openjdk>=17.0.8,<18
deps =
    pyspark[connect]==4.1.2
    pandas==3.0.3
commands =
    {envbindir}/python -m pytest --cov=datacompy --cov-report=term-missing {posargs}
    {envbindir}/python -m pytest -c pytest-ansi.ini --cov=datacompy --cov-report=term-missing --cov-append {posargs}
    {envbindir}/python -m pytest -c pytest-connect.ini {posargs:tests/test_spark.py tests/comparator/}
    {envbindir}/python -m pytest -m spark_connect {posargs:tests/test_spark_connect.py}
